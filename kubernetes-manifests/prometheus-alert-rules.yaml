apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: default  # Or whatever namespace you're using
data:
  prometheus-alert-rules.yaml: |
    groups:
      - name: OnlineBoutiqueAlerts
        rules:

          # R1 Requirement: Cart Operations Integrity, Performance, and Resource Usage

          ## Latency Alerts
          - alert: HighCartOperationLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="cartservice", endpoint=~"/AddItem|/GetCart|/EmptyCart"}[5m])) > 0.2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cart operations experiencing high latency"
              description: "95th percentile response time for cart operations exceeded 200ms for 5 minutes."

          - alert: CriticalCartOperationLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="cartservice", endpoint=~"/AddItem|/GetCart|/EmptyCart"}[5m])) > 0.5
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Cart operations critical latency issue"
              description: "95th percentile response time for cart operations exceeded 500ms for 2 minutes. Investigate potential overload."

          ## Failure Rate Alerts
          - alert: HighCartOperationFailureRate
            expr: (sum(rate(http_requests_total{job="cartservice", endpoint=~"/AddItem|/GetCart|/EmptyCart", status=~"5.."}[5m])) /
                    sum(rate(http_requests_total{job="cartservice", endpoint=~"/AddItem|/GetCart|/EmptyCart"}[5m]))) > 0.005
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cart operations failure rate is too high"
              description: "Failure rate for cart operations exceeded 0.5% over the last 5 minutes."

          ## Resource Usage Alerts
          - alert: HighCartServiceCPUUsage
            expr: avg(rate(container_cpu_usage_seconds_total{container="cart-service"}[5m])) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cart service high CPU usage"
              description: "Cart service CPU utilization exceeded 80% for more than 5 minutes."

          - alert: HighCartServiceMemoryUsage
            expr: avg(container_memory_usage_bytes{container="cart-service"} / container_spec_memory_limit_bytes{container="cart-service"}) > 0.7
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Cart service high memory usage"
              description: "Cart service memory utilization exceeded 70% for more than 5 minutes."

