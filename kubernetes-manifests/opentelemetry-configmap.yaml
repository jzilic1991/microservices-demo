apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317  # OpenTelemetry gRPC receiver

    processors:
      batch: {}

    exporters:
      prometheus:
        endpoint: "0.0.0.0:9464"  # Exposes the metrics in Prometheus format

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheus]

